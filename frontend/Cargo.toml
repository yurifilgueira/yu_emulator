[package]
name = "frontend"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Yu-Emulator window frontend: shows the picture of a core and feeds it input."

[[bin]]
name = "yu-emulator"
path = "src/main.rs"

[dependencies]
cpal = "0.15"
eframe = { version = "0.37", default-features = false, features = ["wgpu", "x11", "wayland"] }
gilrs = "0.11"
psx-core = { path = "../psx-core" }
rfd = "0.18"

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }
image = { version = "0.25", default-features = false, features = ["png"] }
